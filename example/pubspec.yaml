name: flutter_meta_wearables_dat_example
description: "Demonstrates how to use the flutter_meta_wearables_dat plugin."
version: 0.0.1+1
publish_to: 'none'

environment:
  sdk: ^3.12.0
  # The Xcode project is deintegrated from CocoaPods and carries SwiftPM
  # package references, so it only builds on a Flutter that has SwiftPM on by
  # default. Without this, an older Flutter fails deep in xcodebuild with an
  # unresolvable-package error instead of here with a clear message.
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_meta_wearables_dat:
    path: ../

  # Optional MockDeviceKit add-on. The example app uses mock pairing for
  # development; production apps should omit this dependency to keep
  # MockDeviceKit/AVFoundation/Camera symbols out of their binary and skip
  # the matching Info.plist / AndroidManifest permission strings.
  flutter_meta_wearables_dat_mock_device:
    path: ../flutter_meta_wearables_dat_mock_device

  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  image_picker: ^1.2.0
  file_picker: ^8.1.4
  app_links: ^6.3.4
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  very_good_analysis: ^10.0.0


flutter:
  # Pin the resolver at project scope. The `flutter: '>=3.44.0'` constraint
  # above guarantees a Flutter that has SwiftPM, but it does not override a
  # developer's global `flutter config --no-enable-swift-package-manager`.
  # With that set, `flutter pub get` regenerates ios/Podfile and the CocoaPods
  # xcconfig includes, and the build then fails because the committed Xcode
  # project carries SwiftPM package references.
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  assets:
    - assets/images/cameraAccessIcon.png