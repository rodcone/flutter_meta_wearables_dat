name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# A tag re-push starts a second run for the same tag, and pub.dev versions are
# immutable, so two concurrent publishes would race to upload the same version.
# Queue instead of cancelling: never interrupt a run that may be mid-publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Needed for dart pub publish with OIDC authentication
permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Both packages publish in lockstep — verify the tag matches *both*
      # pubspecs before doing anything destructive.
      - name: Verify tag matches both pubspec versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in . flutter_meta_wearables_dat_mock_device; do
            PUBSPEC_VERSION=$(grep '^version:' "$pkg/pubspec.yaml" | awk '{print $2}')
            if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
              echo "ERROR: tag $TAG_VERSION does not match $pkg/pubspec.yaml ($PUBSPEC_VERSION)"
              exit 1
            fi
          done
          echo "OK: tag $TAG_VERSION matches both pubspecs"

      # Scope analyze to lib/ so the root invocation doesn't recurse into the
      # sibling mock package (whose .dart_tool isn't populated for the root
      # working directory).
      # Dependency resolution against pub.dev fails intermittently in this job
      # with an existing, non-retracted version reported as missing, e.g.
      #
      #   Because flutter_tools depends on test 1.31.1 which doesn't match any
      #   versions, version solving failed.
      #
      # A byte-identical step in a throwaway workflow — same environment,
      # setup-dart, PUB_TOKEN, tag ref, cold SDK — resolves reliably, and every
      # structural difference was eliminated one at a time (SDK versions, the
      # standalone Dart on PATH, PUB_TOKEN, `environment: pub.dev`, tag vs
      # branch ref, fresh trigger vs re-run). So this does not claim a cause:
      # it makes the transient survivable, which is what a release path needs.
      #
      # The cache clean from the second attempt onward is deliberate: the
      # symptom is pub believing a published version does not exist, which is
      # what stale or partial cached metadata looks like.
      - name: Install retry helper
        run: |
          cat > "$RUNNER_TEMP/retry.sh" <<'SH'
          # 5 attempts, sleeping 20/40/80/160s between them: about 5 minutes of
          # cover, which comfortably exceeds the windows observed so far.
          retry() {
            local n max=5 delay=20
            for n in $(seq 1 "$max"); do
              if "$@"; then
                return 0
              fi
              if [ "$n" -lt "$max" ]; then
                echo "::warning::'$*' failed (attempt $n/$max); cleaning pub cache, retrying in ${delay}s"
                dart pub cache clean --force >/dev/null 2>&1 || true
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "::error::'$*' failed after $max attempts"
            return 1
          }
          SH

      - name: Analyze core
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry flutter pub get
          dart analyze --fatal-infos lib/
          if [ -d test ]; then flutter test; else echo "No test directory, skipping"; fi

      - name: Analyze mock add-on
        working-directory: flutter_meta_wearables_dat_mock_device
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry flutter pub get
          dart analyze --fatal-infos lib/
          if [ -d test ]; then flutter test; else echo "No test directory, skipping"; fi

      # Hard quality gate: refuse to publish unless BOTH packages score a
      # perfect 160/160 on pana (the analyzer behind pub.dev's pub points).
      # --exit-code-threshold 0 fails the job if any points are lost.
      - name: Activate pana
        run: dart pub global activate pana
      - name: pana — core (require full pub points)
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .
      - name: pana — mock add-on (require full pub points)
        working-directory: flutter_meta_wearables_dat_mock_device
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .

      # Publish core first; if the mock add-on fails afterwards, re-tag
      # patch-level after fixing — the core publish is not retried, so a
      # half-publish is recoverable by bumping both packages to the next
      # patch and re-running.
      # NOT retried, deliberately. pub.dev versions are immutable, so a retried
      # publish can only either fail as a duplicate or mask a real error. If a
      # publish step fails, read the log and follow the half-publish recovery in
      # doc/MAINTAINERS.md.
      - name: Publish core to pub.dev
        run: dart pub publish --force

      - name: Publish mock add-on to pub.dev
        working-directory: flutter_meta_wearables_dat_mock_device
        run: dart pub publish --force

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Combine release notes from both CHANGELOGs so the GitHub release
      # captures everything that shipped under this tag.
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CORE_NOTES=$(awk "/^## ${VERSION}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          MOCK_NOTES=$(awk "/^## ${VERSION}/{flag=1; next} /^## /{flag=0} flag" flutter_meta_wearables_dat_mock_device/CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "## flutter_meta_wearables_dat $VERSION"
            echo ""
            echo "$CORE_NOTES"
            echo ""
            echo "## flutter_meta_wearables_dat_mock_device $VERSION"
            echo ""
            echo "$MOCK_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: false
