name: CI

on:
  # No `branches:` filter on purpose. Restricting to `main` meant a PR based on
  # another branch — every PR in a stack except the bottom one — got no CI at
  # all. That is not loud: `gh pr checks` prints "no checks reported", which
  # reads like "nothing failing", and the GitHub UI shows no red. The 0.9.0
  # background-streaming work shipped as a four-PR stack in which three were
  # merged-ready with zero validation until they were retargeted one at a time.
  pull_request:
  # Retargeting a PR fires `pull_request.edited`, which is NOT in the default
  # trigger set (opened / synchronize / reopened), so changing a base does not
  # re-run CI. `edited` is deliberately not added here — it also fires on every
  # title and body edit. Use this manual trigger instead of the close/reopen
  # dance when you need a re-run without a new commit.
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - flutter_meta_wearables_dat_mock_device
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      # Scope to lib/ — without it, `dart analyze` from the root recurses into
      # flutter_meta_wearables_dat_mock_device/lib/ but can't resolve its
      # self-imports because the sibling's .dart_tool isn't populated in this
      # matrix slot.
      - name: dart analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos lib/
      - name: dart format
        working-directory: ${{ matrix.package }}
        run: dart format --set-exit-if-changed lib/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - flutter_meta_wearables_dat_mock_device
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: flutter test
        working-directory: ${{ matrix.package }}
        run: if [ -d test ]; then flutter test; else echo "No test directory, skipping"; fi

  dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - flutter_meta_wearables_dat_mock_device
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: dart pub publish --dry-run
        working-directory: ${{ matrix.package }}
        run: dart pub publish --dry-run

  versions-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # All FOUR version locations must agree, matching the pre-flight checklist
      # in doc/MAINTAINERS.md. The two pubspecs alone are not enough: the
      # podspecs carry their own `s.version`, they feed the pod versions
      # recorded in consumers' Podfile.lock, and nothing else in CI reads them —
      # 0.8.1 shipped to review with both podspecs still on 0.8.0.
      - name: Verify all four version locations match
        run: |
          CORE_PUBSPEC=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          MOCK_PUBSPEC=$(grep '^version:' flutter_meta_wearables_dat_mock_device/pubspec.yaml | awk '{print $2}')
          CORE_PODSPEC=$(grep "s.version" ios/flutter_meta_wearables_dat.podspec | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          MOCK_PODSPEC=$(grep "s.version" flutter_meta_wearables_dat_mock_device/ios/flutter_meta_wearables_dat_mock_device.podspec | head -1 | sed "s/.*'\(.*\)'.*/\1/")

          echo "core   pubspec.yaml : $CORE_PUBSPEC"
          echo "mock   pubspec.yaml : $MOCK_PUBSPEC"
          echo "core   podspec      : $CORE_PODSPEC"
          echo "mock   podspec      : $MOCK_PODSPEC"

          FAIL=0
          for pair in "mock pubspec:$MOCK_PUBSPEC" "core podspec:$CORE_PODSPEC" "mock podspec:$MOCK_PODSPEC"; do
            LABEL="${pair%%:*}"
            VALUE="${pair##*:}"
            if [ "$VALUE" != "$CORE_PUBSPEC" ]; then
              echo "ERROR: $LABEL is $VALUE but core pubspec.yaml is $CORE_PUBSPEC"
              FAIL=1
            fi
          done
          if [ -z "$CORE_PODSPEC" ] || [ -z "$MOCK_PODSPEC" ]; then
            echo "ERROR: failed to parse a podspec version — check the s.version format"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "All four locations must match — they release in lockstep (see doc/MAINTAINERS.md)"
            exit 1
          fi
          echo "OK: all four version locations are at $CORE_PUBSPEC"

      # The install snippets in README / AGENTS / the agent rule files are a
      # fifth version location, and until now nothing read them. `^0.9.0`
      # resolves to >=0.9.0 <0.10.0, so a *minor* bump silently leaves every
      # snippet pinning users to a release without the new API. The
      # StreamFrameRate work reached review that way, with the README telling
      # users to install a version its own streaming example could not compile
      # against.
      #
      # The rule is caret containment, not equality: `^0.9.0` legitimately
      # admits 0.9.1, so patch releases need no doc churn. Docs are discovered
      # by glob rather than a fixed list, so a newly added agent file is covered
      # automatically; changelogs are skipped because their historical entries
      # legitimately quote old constraints.
      - name: Verify doc install snippets admit the current version
        run: |
          python3 - <<'CHECK_SNIPPETS'
          import re, sys, pathlib

          PKGS = {
              'flutter_meta_wearables_dat': 'pubspec.yaml',
              'flutter_meta_wearables_dat_mock_device':
                  'flutter_meta_wearables_dat_mock_device/pubspec.yaml',
          }

          def core(v, where):
              m = re.match(r'(\d+)\.(\d+)\.(\d+)', v)
              if not m:
                  sys.exit(f'::error::unparseable version {v!r} in {where}')
              return tuple(int(g) for g in m.groups())

          def caret_upper(v):
              """Upper bound of pub's `^v`, matching dart.dev/tools/pub/dependencies."""
              x, y, z = v
              if x > 0:
                  return (x + 1, 0, 0)
              if y > 0:
                  return (0, y + 1, 0)
              return (0, 0, z + 1)

          versions = {}
          for pkg, path in PKGS.items():
              txt = pathlib.Path(path).read_text()
              versions[pkg] = core(re.search(r'^version:\s*(\S+)', txt, re.M).group(1), path)

          # Scan every doc rather than a hardcoded file list, so a newly added agent
          # file is covered automatically. Changelogs are excluded: their historical
          # entries legitimately quote old constraints.
          files = [
              p for p in sorted([*pathlib.Path('.').rglob('*.md'), *pathlib.Path('.').rglob('*.mdc')])
              if 'CHANGELOG' not in p.name
              and not any(part in ('build', '.dart_tool', '.git') for part in p.parts)
          ]

          pattern = re.compile(
              r'\b(flutter_meta_wearables_dat(?:_mock_device)?)\b\s*:\s*\^(\d+\.\d+\.\d+)')

          stale, checked = [], 0
          for p in files:
              for lineno, line in enumerate(p.read_text().splitlines(), 1):
                  for m in pattern.finditer(line):
                      pkg, snippet = m.group(1), m.group(2)
                      if pkg not in versions:
                          continue
                      checked += 1
                      lo = core(snippet, p)
                      hi = caret_upper(lo)
                      actual = versions[pkg]
                      if not (lo <= actual < hi):
                          stale.append(
                              f'{p}:{lineno}: ^{snippet} does not admit '
                              f'{".".join(map(str, actual))} ({pkg})')

          for pkg, v in versions.items():
              print(f'  {pkg}: {".".join(map(str, v))}')
          print(f'  checked {checked} constraint(s) across {len(files)} doc file(s)')

          # A pattern that matches nothing must fail, not pass silently: a docs reformat
          # would otherwise leave this job green while covering zero constraints.
          if checked == 0:
              sys.exit('::error::no install snippets matched — the pattern has drifted')

          if stale:
              print('\nStale install snippets (a user following these installs a release '
                    'without the current API):')
              for s in stale:
                  print(f'::error::{s}')
              sys.exit(1)

          print('OK: every install snippet admits the current version')
          CHECK_SNIPPETS

  # Gate on a perfect pub.dev score for both packages. pana is the analyzer
  # behind pub.dev's "pub points"; --exit-code-threshold 0 fails the job when
  # any points are lost (max - granted > 0), so every release stays at
  # 160/160. Runs on a clean checkout so pana resolves the package itself.
  platform-thread-affinity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Flutter requires channel messages to be sent from the platform thread.
      # `VideoFrameStreamHandler` invoked its sink from a private serial queue
      # instead, which the engine reports as "sent a message from a
      # non-platform thread" and which left `videoFramesStream()` delivering
      # nothing at all on iOS — a silent failure, since the texture preview
      # kept working and only consumers of the frame stream were affected.
      #
      # Every other handler already hopped to the main actor, so this was one
      # file out of step rather than a design gap. The invariant is cheap to
      # state and would have caught it: a handler that invokes an event sink
      # must show evidence of a platform-thread hop.
      #
      # Deliberately a source check rather than a unit test. The handler lives
      # in a SwiftPM target that links the vendored MWDAT xcframeworks, whose
      # simulator slices do not currently build, so there is nowhere to run an
      # XCTest against it. A debug `assert(Thread.isMainThread)` in the
      # delivery path covers the same invariant at runtime on device.
      - name: Event sinks are invoked on the platform thread
        run: |
          FAIL=0
          for f in ios/flutter_meta_wearables_dat/Sources/flutter_meta_wearables_dat/*StreamHandler.swift; do
            SENDS=$(grep -vE '^[[:space:]]*(//|\*|/\*)' "$f" | grep -cE '[Ss]ink\??\(|events\??\(' || true)
            if [ "$SENDS" -eq 0 ]; then
              echo "skip $(basename "$f") — no sink invocation"
              continue
            fi
            if grep -qE '@MainActor|DispatchQueue\.main|Thread\.isMainThread' "$f"; then
              echo "OK   $(basename "$f") — $SENDS sink call(s), hops to the platform thread"
            else
              echo "ERROR: $(basename "$f") invokes an event sink with no platform-thread hop"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "Send channel messages from the platform thread — dispatch to main before calling the sink."
            exit 1
          fi
          echo "OK: every stream handler that sends to Dart hops to the platform thread"

      # MWDAT video frames wrap SDK-owned sample buffers. Processing them after
      # the publisher callback returns can retain the SDK's capture pool and
      # eventually stop delivery without an SDK error or state transition.
      - name: iOS SDK frames are consumed within the publisher callback
        run: |
          PLUGIN=ios/flutter_meta_wearables_dat/Sources/flutter_meta_wearables_dat/MetaWearablesDatPlugin.swift
          CALLBACK=$(grep -A 25 'videoFramePublisher.listen' "$PLUGIN")
          if ! echo "$CALLBACK" | grep -q 'self.frameQueue.sync'; then
            echo "ERROR: videoFramePublisher must synchronously consume SDK-owned frames"
            exit 1
          fi
          if echo "$CALLBACK" | grep -q 'self.frameQueue.async'; then
            echo "ERROR: videoFramePublisher retains SDK-owned frames across an async hop"
            exit 1
          fi
          echo "OK: SDK-owned frames are consumed before the publisher callback returns"

      # DAT's raw iOS codec is 420v bi-planar YUV, while the Dart contract is
      # packed BGRA. A top-level base-address copy compiles and produces bytes,
      # but they are neither a complete planar frame nor BGRA; this exact bug
      # reached devices as a 772-byte stride for a 504-pixel-wide frame.
      - name: iOS raw frame events are converted to BGRA
        run: |
          HANDLER=ios/flutter_meta_wearables_dat/Sources/flutter_meta_wearables_dat/VideoFrameStreamHandler.swift
          CONVERTER=ios/flutter_meta_wearables_dat/Sources/flutter_meta_wearables_dat/RawVideoFrameBGRAConverter.swift
          if ! grep -q 'rawConverter.convert(pixelBuffer)' "$HANDLER"; then
            echo "ERROR: emitRaw must normalize DAT raw frames before building the Dart payload"
            exit 1
          fi
          if ! grep -q 'vImageConvert_420Yp8_CbCr8ToARGB8888' "$CONVERTER" || \
             ! grep -q 'kCVPixelFormatType_32BGRA' "$CONVERTER"; then
            echo "ERROR: DAT 420v frames must be converted into packed BGRA"
            exit 1
          fi
          echo "OK: iOS raw frame events normalize DAT YUV buffers to BGRA"

  pana:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - flutter_meta_wearables_dat_mock_device
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Activate pana
        run: dart pub global activate pana
      - name: pana (require full pub points)
        working-directory: ${{ matrix.package }}
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .

  # Build the example app. The example is committed fully deintegrated from
  # CocoaPods and its pbxproj carries the SwiftPM package references, so only
  # the SwiftPM path is covered here. Both plugins still ship a podspec for
  # CocoaPods consumers; that path is covered by `cocoapods-build` below.
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to latest-stable: the default Xcode on `macos-latest` lags real
      # releases, and the vendored xcframeworks want a current toolchain.
      #
      # Until 0.9.1 this pin was justified by `.allowBluetoothHFP`, an iOS-18
      # AVAudioSession option. That option was dropped (it forced the glasses
      # off A2DP onto an 8 kHz SCO link that contended with the video
      # transport), and no iOS-18-only API remains — the deployment floor is
      # 17.2. So the pin is now toolchain hygiene rather than a hard
      # requirement; it stays because an image-default Xcode regression should
      # not be the thing that breaks a release build.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # SwiftPM is the default from Flutter 3.44, but do not assert that via
      # `flutter config --list`: it prints "(Not set)" for defaults, so a grep
      # for "true" passes only on a machine that has set the flag explicitly.
      # Assert the outcome instead. Plugin injection during pub get writes a
      # Podfile only when CocoaPods is in play, so its absence is direct
      # evidence the example resolved through SwiftPM.
      - name: flutter pub get
        working-directory: example
        run: flutter pub get
      - name: Assert SwiftPM was used, not CocoaPods
        working-directory: example
        run: |
          set -euo pipefail
          if [ -f ios/Podfile ]; then
            echo "ERROR: ios/Podfile was generated, so this built through CocoaPods."
            exit 1
          fi
      - name: Build iOS example
        working-directory: example
        run: flutter build ios --release --no-codesign

  # Verify the podspecs still integrate. The example app can no longer do this:
  # it is committed deintegrated from CocoaPods and its pbxproj carries SwiftPM
  # package references, which fail to resolve once SwiftPM is disabled. So this
  # builds a throwaway app instead, which is also closer to what a CocoaPods
  # consumer actually does. Without this job a podspec break (a moved source
  # path, a new system framework, a fourth xcframework) would ship unnoticed.
  cocoapods-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Must come before `flutter create`, which bakes SwiftPM package
      # references straight into the pbxproj while SwiftPM is on. (It emits no
      # Podfile in either mode; the Podfile comes from plugin injection during
      # pub get, which is why the step below runs after `flutter pub add`.)
      - name: Select CocoaPods
        run: flutter config --no-enable-swift-package-manager
      - name: Scaffold a throwaway consumer app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/podcheck"
          cd "$RUNNER_TEMP/podcheck"
          flutter create --platforms=ios --project-name podcheck .
          flutter pub add \
            "flutter_meta_wearables_dat:{'path':'$GITHUB_WORKSPACE'}" \
            "flutter_meta_wearables_dat_mock_device:{'path':'$GITHUB_WORKSPACE/flutter_meta_wearables_dat_mock_device'}"
      # Both podspecs floor at iOS 17.2; a fresh Flutter app targets lower, and
      # CocoaPods fails the build on the mismatch rather than raising it.
      - name: Raise the deployment target to 17.2
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/podcheck"
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 17.2;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/^# platform :ios.*/platform :ios, '17.2'/" ios/Podfile
          grep -q "^platform :ios, '17.2'" ios/Podfile
      - name: Build the throwaway app through CocoaPods
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/podcheck"
          flutter build ios --release --no-codesign
      # Proves the pods were actually used, not silently skipped.
      - name: Assert both plugins resolved as pods
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/podcheck"
          grep -q "flutter_meta_wearables_dat (" ios/Podfile.lock
          grep -q "flutter_meta_wearables_dat_mock_device (" ios/Podfile.lock

  # Compile the Android side. Every other job is Dart-only or iOS-only, so
  # without this a Kotlin break in either plugin reaches main unnoticed.
  # Building the example APK covers both plugins at once, since it depends on
  # the core and the mock add-on.
  #
  # DAT 1.0.0 artifacts are public on Maven Central; fork PRs need no token.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: example
        run: flutter pub get
      - name: Build Android example
        working-directory: example
        run: flutter build apk --release
      # The plugin's Kotlin unit tests. They cover the process-wide foreground
      # detection rules, which are pure logic and the only part of the
      # background-streaming behaviour that is verifiable without hardware.
      # Runs from example/android because the plugin's Gradle project is only
      # resolvable in the context of a host app.
      - name: Android unit tests
        working-directory: example/android
        run: ./gradlew :flutter_meta_wearables_dat:testDebugUnitTest
