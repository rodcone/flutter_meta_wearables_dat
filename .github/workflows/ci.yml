name: CI

on:
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - flutter_meta_wearables_dat_mock_device
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      # Scope to lib/ — without it, `dart analyze` from the root recurses into
      # flutter_meta_wearables_dat_mock_device/lib/ but can't resolve its
      # self-imports because the sibling's .dart_tool isn't populated in this
      # matrix slot.
      - name: dart analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos lib/
      - name: dart format
        working-directory: ${{ matrix.package }}
        run: dart format --set-exit-if-changed lib/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - flutter_meta_wearables_dat_mock_device
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: flutter test
        working-directory: ${{ matrix.package }}
        run: if [ -d test ]; then flutter test; else echo "No test directory, skipping"; fi

  dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - flutter_meta_wearables_dat_mock_device
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: dart pub publish --dry-run
        working-directory: ${{ matrix.package }}
        run: dart pub publish --dry-run

  versions-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # All FOUR version locations must agree, matching the pre-flight checklist
      # in doc/MAINTAINERS.md. The two pubspecs alone are not enough: the
      # podspecs carry their own `s.version`, they feed the pod versions
      # recorded in consumers' Podfile.lock, and nothing else in CI reads them —
      # 0.8.1 shipped to review with both podspecs still on 0.8.0.
      - name: Verify all four version locations match
        run: |
          CORE_PUBSPEC=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          MOCK_PUBSPEC=$(grep '^version:' flutter_meta_wearables_dat_mock_device/pubspec.yaml | awk '{print $2}')
          CORE_PODSPEC=$(grep "s.version" ios/flutter_meta_wearables_dat.podspec | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          MOCK_PODSPEC=$(grep "s.version" flutter_meta_wearables_dat_mock_device/ios/flutter_meta_wearables_dat_mock_device.podspec | head -1 | sed "s/.*'\(.*\)'.*/\1/")

          echo "core   pubspec.yaml : $CORE_PUBSPEC"
          echo "mock   pubspec.yaml : $MOCK_PUBSPEC"
          echo "core   podspec      : $CORE_PODSPEC"
          echo "mock   podspec      : $MOCK_PODSPEC"

          FAIL=0
          for pair in "mock pubspec:$MOCK_PUBSPEC" "core podspec:$CORE_PODSPEC" "mock podspec:$MOCK_PODSPEC"; do
            LABEL="${pair%%:*}"
            VALUE="${pair##*:}"
            if [ "$VALUE" != "$CORE_PUBSPEC" ]; then
              echo "ERROR: $LABEL is $VALUE but core pubspec.yaml is $CORE_PUBSPEC"
              FAIL=1
            fi
          done
          if [ -z "$CORE_PODSPEC" ] || [ -z "$MOCK_PODSPEC" ]; then
            echo "ERROR: failed to parse a podspec version — check the s.version format"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "All four locations must match — they release in lockstep (see doc/MAINTAINERS.md)"
            exit 1
          fi
          echo "OK: all four version locations are at $CORE_PUBSPEC"

  # Gate on a perfect pub.dev score for both packages. pana is the analyzer
  # behind pub.dev's "pub points"; --exit-code-threshold 0 fails the job when
  # any points are lost (max - granted > 0), so every release stays at
  # 160/160. Runs on a clean checkout so pana resolves the package itself.
  pana:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - flutter_meta_wearables_dat_mock_device
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Activate pana
        run: dart pub global activate pana
      - name: pana (require full pub points)
        working-directory: ${{ matrix.package }}
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .

  # Build the example app on both iOS resolvers. Example app is committed in
  # its CocoaPods baseline state; on the SPM job Flutter migrates the
  # pbxproj on the fly. Catches regressions on either path.
  ios-build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        resolver: [cocoapods, spm]
    steps:
      - uses: actions/checkout@v4
      # `BackgroundStreamingController.swift` uses iOS-18+ AVAudioSession APIs
      # (`.allowBluetoothHFP`) so the build needs the matching SDK. The default
      # Xcode on `macos-latest` images lags real releases — pin to latest-stable.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure iOS resolver (${{ matrix.resolver }})
        run: |
          if [ "${{ matrix.resolver }}" = "spm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi
      - name: flutter pub get
        working-directory: example
        run: flutter pub get
      - name: Build iOS example
        working-directory: example
        run: flutter build ios --release --no-codesign

  # Compile the Android side. Every other job is Dart-only or iOS-only, so
  # without this a Kotlin break in either plugin reaches main unnoticed.
  # Building the example APK covers both plugins at once, since it depends on
  # the core and the mock add-on.
  #
  # Resolving `com.meta.wearable:mwdat-*` needs a token: Maven packages on
  # GitHub Packages require authentication even when public, and
  # example/android/settings.gradle.kts reads it from GITHUB_TOKEN. The
  # workflow's built-in token is scoped to this repository and is not reliably
  # accepted for facebook/meta-wearables-dat-android, so a repo secret
  # MWDAT_PACKAGES_TOKEN (a PAT with `read:packages`) takes precedence when
  # present. See doc/MAINTAINERS.md.
  #
  # Fork PRs get no secrets at all, so skip there rather than showing a
  # permanently red check that a contributor cannot fix.
  android-build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: example
        run: flutter pub get
      - name: Build Android example
        working-directory: example
        env:
          GITHUB_TOKEN: ${{ secrets.MWDAT_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: flutter build apk --release
      # The plugin's Kotlin unit tests. They cover the process-wide foreground
      # detection rules, which are pure logic and the only part of the
      # background-streaming behaviour that is verifiable without hardware.
      # Runs from example/android because the plugin's Gradle project is only
      # resolvable in the context of a host app.
      - name: Android unit tests
        working-directory: example/android
        env:
          GITHUB_TOKEN: ${{ secrets.MWDAT_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :flutter_meta_wearables_dat:testDebugUnitTest
