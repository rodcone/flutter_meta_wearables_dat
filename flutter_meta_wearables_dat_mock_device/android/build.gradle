group = "io.rodcone.flutter_meta_wearables_dat_mock_device"
version = "1.0-SNAPSHOT"

ext.mwdat_version = "0.7.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "io.rodcone.flutter_meta_wearables_dat_mock_device"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 29
    }

    dependencies {
        // mwdat-core provides the Permission / PermissionStatus types reused
        // by this add-on, plus the Wearables singleton MockDeviceKit registers
        // its mock devices into. The core plugin already pulls it transitively,
        // but declaring it here keeps this module compilable in isolation.
        implementation("com.meta.wearable:mwdat-core:$mwdat_version")
        implementation("com.meta.wearable:mwdat-mockdevice:$mwdat_version")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
