group = "io.rodcone.flutter_meta_wearables_dat"
version = "1.0-SNAPSHOT"

ext.mwdat_version = "0.9.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Flutter is moving to "Built-in Kotlin" with AGP 9 (Flutter 3.44+); applying
// the Kotlin Gradle Plugin there both triggers a deprecation warning and will
// fail the build in a future Flutter release. Apply KGP only on the legacy
// path; on AGP 9+, AGP injects Kotlin support itself.
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "io.rodcone.flutter_meta_wearables_dat"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 29
    }

    dependencies {
        implementation("com.meta.wearable:mwdat-core:$mwdat_version")
        implementation("com.meta.wearable:mwdat-camera:$mwdat_version")
        implementation("androidx.emoji2:emoji2:1.5.0")
        // Required for ActivityResultRegistry and ComponentActivity
        implementation("androidx.activity:activity-ktx:1.9.3")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
        // `useJUnitPlatform()` below has been configured since before any tests
        // existed, but without an engine on the test runtime classpath Gradle
        // discovers zero tests and reports success — so the suite silently did
        // not run. Required for the JUnit 5 annotations to execute.
        testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2")
        testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2")
    }

    testOptions {
        // Without this, any `android.util.Log` call reached from code under
        // test throws "not mocked" and fails the test for a reason that has
        // nothing to do with the behaviour being asserted.
        unitTests.returnDefaultValues = true

        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
